<!doctype html>
<html lang="tr" data-theme="dark">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Sosyal Bilimler Kütüphanesi</title>
  <meta name="description" content="Tematik kesişmeler: iktisat, felsefe, hukuk, siyaset bilimi — uzun-form okuma kitapları.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Source+Serif+4:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles/book.css">
  <link rel="stylesheet" href="styles/landing.css">
</head>
<body class="landing">

  <header class="landing-header">
    <h1>Sosyal Bilimler Kütüphanesi</h1>
    <p class="subtitle">Tematik kesişmeler — iktisat, felsefe, hukuk, siyaset bilimi</p>
  </header>

  <main class="theme-grid" id="themeGrid" aria-label="Tema'lar">
    <!-- theme-registry.js doldurur -->
  </main>

  <section class="pane-shortcuts" aria-labelledby="paneShortcutTitle">
    <div class="pane-shortcuts-head">
      <span>Dünya Tarihi Atlası</span>
      <h2 id="paneShortcutTitle">Pane kısayolları</h2>
    </div>
    <div class="pane-shortcut-grid" id="paneShortcutGrid" aria-label="Pane kısa yolları">
      <!-- index.html script'i doldurur -->
    </div>
  </section>

  <footer class="landing-footer">
    <a href="roadmap.html">Yol Haritası</a>
    ·
    <a href="merkantilizm/appendix/playground.html">Merkantilizm Appendix (eski oyun alanı)</a>
    ·
    <a href="https://github.com/Fatihzxc/education">github.com/Fatihzxc/education</a>
  </footer>

  <script>
  // Theme bootstrap — match book pages so the landing respects the user's choice.
  (function() {
    var saved = null;
    try { saved = localStorage.getItem('merkantilizm.theme'); } catch (e) {}
    var theme = saved || (matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark');
    document.documentElement.setAttribute('data-theme', theme);
  })();
  </script>
  <script src="modules/theme-registry.js?v=1"></script>
  <script>
  (function() {
    'use strict';
    var themes = window.MerkantilizmThemes || [];
    var grid = document.getElementById('themeGrid');
    var paneGrid = document.getElementById('paneShortcutGrid');
    function esc(s) {
      return String(s == null ? '' : s)
        .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;').replace(/'/g, '&#39;');
    }
    var statusLabel = { completed: 'tamamlandı', draft: 'taslak', pending: 'planlandı' };
    grid.innerHTML = themes.map(function(t) {
      return '<a class="theme-card status-' + esc(t.status) + '" href="' + esc(t.slug) + '/book.html">' +
        '<h2>' + esc(t.title) + '</h2>' +
        '<p class="card-subtitle">' + esc(t.subtitle) + '</p>' +
        '<p class="card-description">' + esc(t.description || '') + '</p>' +
        '<div class="card-meta">' +
          '<span>' + t.chapterCount + ' bölüm</span>' +
          '<span class="status-badge">' + esc(statusLabel[t.status] || t.status) + '</span>' +
        '</div>' +
      '</a>';
    }).join('');

    var paneShortcuts = [
      { title: 'Merkantilizm', period: '1500-1750', color: '#c98a3a', href: 'tarih-atlasi/appendix/panes.html#merkantilizm', bookHref: 'tarih-atlasi/panes/merkantilizm/book.html#bolum/1' },
      { title: 'Fizyokrasi', period: '1750-1780', color: '#8ab36b', href: 'tarih-atlasi/appendix/panes.html#fizyokrasi', bookHref: 'tarih-atlasi/panes/fizyokrasi/book.html#bolum/1' },
      { title: 'Klasik İktisat', period: '1776-1870', color: '#65a6b7', href: 'tarih-atlasi/appendix/panes.html#klasik', bookHref: 'tarih-atlasi/panes/klasik/book.html#bolum/1' },
      { title: 'Marx ve Artı-Değer', period: '1848-1890', color: '#c96d6d', href: 'tarih-atlasi/appendix/panes.html#marx', bookHref: 'tarih-atlasi/panes/marx/book.html#bolum/1' },
      { title: 'Marjinalizm', period: '1871-1930', color: '#a996d8', href: 'tarih-atlasi/appendix/panes.html#marjinalizm', bookHref: 'tarih-atlasi/panes/marjinalizm/book.html#bolum/1' },
      { title: 'Keynesçilik', period: '1930-1980+', color: '#7fa5c9', href: 'tarih-atlasi/appendix/panes.html#keynes', bookHref: 'tarih-atlasi/panes/keynes/book.html#bolum/1' }
    ];
    paneGrid.innerHTML = paneShortcuts.map(function(pane) {
      return '<article class="pane-shortcut-card" style="--pane-color:' + esc(pane.color) + '">' +
        '<span class="pane-dot" aria-hidden="true"></span>' +
        '<strong>' + esc(pane.title) + '</strong>' +
        '<small>' + esc(pane.period) + '</small>' +
        '<div class="pane-shortcut-actions">' +
          '<a href="' + esc(pane.href) + '">Pane’i aç</a>' +
          '<a href="' + esc(pane.bookHref) + '">Mini kitabı aç</a>' +
        '</div>' +
      '</article>';
    }).join('');
  })();
  </script>

</body>
</html>
