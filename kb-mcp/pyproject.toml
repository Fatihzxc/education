[project]
name = "iktisat-kb"
version = "0.1.0"
description = "Local MCP server for indexing & searching mercantilism research sources (PDF/TXT) with Turkish-aware tokenization."
requires-python = ">=3.10"
authors = [{name = "Fatih Öner"}]

dependencies = [
    "mcp>=1.0.0",
    "pypdf>=4.0.0",
]

[project.optional-dependencies]
semantic = [
    "sentence-transformers>=2.2.0",
    "faiss-cpu>=1.7.0",
]
ocr = [
    "PyMuPDF>=1.24.0",
]

[project.scripts]
iktisat-kb = "src.server:main"

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["src*"]
